version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
    volumes:
      - ./appqdrant_storage:/qdrant/storage
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: ${CONTAINER_NAME}
    env_file:
      - .env
    ports:
      - "8882:8882"
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
    restart: always
  
  consumer:
    restart: always
    build: .
    container_name: ${CONSUMER_NAME}
    command: bash -c "python -m app.tasks.consumer"
    env_file:
        - .env
    volumes:
        - ./logs:/app/logs