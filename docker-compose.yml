version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
    volumes:
      - ./appqdrant_storage:/qdrant/storage
    restart: always

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --requirepass ${REDIS_PASS}
    ports:
      - "6379:6379"
    restart: always

  app:
    build: .
    container_name: sleep_ai_app
    env_file:
      - .env
    ports:
      - "8881:8881"
    depends_on:
      - qdrant
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      HF_TOKEN: ${HF_TOKEN}
    restart: always
  
  consumer_dev:
    restart: always
    build: .
    container_name: consumer_dev
    command: bash -c "python -m app.tasks.consumer_dev"
    env_file:
        - .env
    volumes:
        - ./logs:/app/logs

  consumer_prod:
    restart: always
    build: .
    container_name: consumer_prod
    command: bash -c "python -m app.tasks.consumer_prod"
    env_file:
        - .env
    volumes:
        - ./logs:/app/logs